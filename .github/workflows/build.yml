name: Build PSP EBOOT
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Show psp-config
        run: which psp-config && psp-config --pspsdk-path
      - name: Build
        run: make
      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: EBOOT.PBP
